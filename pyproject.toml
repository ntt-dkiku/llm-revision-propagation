[project]
name = "llm-revision-propagation"
version = "0.0.1"
description = "RevPropBench — a benchmark and test-time compute methods for revision propagation in conversationally generated JSON artifacts."
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "networkx>=3.3",
    "jsonschema>=4.23.0",
    "matplotlib>=3.9.0",
    "tenacity>=9.0.0",
    "sqllineage>=1.5.7",
    "sqlglot>=30.7.0",
    "duckdb>=1.5.2",
    "litellm>=1.60.0",
    "diskcache>=5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "benchmark", "methods"]

[tool.uv]
# Supply-chain cooldown: resolve as if "now" were 1 week ago. Releases newer
# than that window are invisible to `uv lock` / `uv sync` / `uv add`.
# Override on intentional refresh with `make refresh-lock`.
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "hypothesis>=6.100.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires the local LLM stack (vLLM + LiteLLM proxy) to be running",
]
