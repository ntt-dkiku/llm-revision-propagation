name: llm-revision-propagation

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: revpropbench-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    shm_size: "16gb"
    ports:
      - "${VLLM_HOST_PORT}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=${VLLM_GPUS}
      - VLLM_LOGGING_LEVEL=INFO
      - HF_HUB_DISABLE_XET=1
      - HF_XET_NUM_CONCURRENT_RANGE_GETS=1
      - HF_HUB_ENABLE_HF_TRANSFER=0
    volumes:
      - ${HF_HOME}:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL}
      --served-model-name ${VLLM_SERVED_NAME}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTIL}
      --max-model-len ${VLLM_MAX_MODEL_LEN}
      --dtype ${VLLM_DTYPE}
      --enable-auto-tool-choice
      --tool-call-parser ${VLLM_TOOL_PARSER}
      --reasoning-parser ${VLLM_REASONING_PARSER}
      --trust-remote-code
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s
